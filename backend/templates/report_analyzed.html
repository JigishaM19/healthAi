<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Medical Report Analysis Completed</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background-color: #0b1329; color: #f8fafc; margin: 0; padding: 20px; }
    .card { max-width: 560px; margin: 0 auto; background: #131f3d; border: 1px solid #1e293b; border-radius: 20px; padding: 32px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    .logo { font-size: 24px; font-weight: 800; color: #38bdf8; text-align: center; margin-bottom: 24px; }
    .btn { display: inline-block; background: linear-gradient(135deg, #06b6d4, #14b8a6); color: #0f172a; font-weight: 800; text-decoration: none; padding: 14px 28px; border-radius: 12px; margin: 20px 0; text-align: center; }
    .footer { text-align: center; font-size: 12px; color: #64748b; margin-top: 32px; border-t: 1px solid #1e293b; padding-top: 16px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">HealthAI Intelligence 🩺</div>
    <h2>Medical Report Analysis Ready</h2>
    <p>Hello {{ user_name }},</p>
    <p>Your uploaded medical document (<strong>{{ file_name }}</strong>) has been processed and analyzed by HealthAI.</p>
    
    <div style="background: #0f172a; border-left: 4px solid #38bdf8; padding: 16px; border-radius: 8px; margin: 16px 0; font-size: 13px;">
      <strong>AI Summary:</strong><br>
      {{ summary }}
    </div>

    <div style="text-align: center;">
      <a href="{{ app_url }}/reports" class="btn">View Full Report & Insights</a>
    </div>

    <div class="footer">
      © 2026 HealthAI Intelligence Platform.
    </div>
  </div>
</body>
</html>
